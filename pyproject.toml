[project]
name = "ai-parse-doc"
version = "0.1.0"
description = "USA-derived OCR document parsing endpoints on Databricks (Florence-2, Phi-3.5-vision, Granite-Vision) callable via ai_query SQL UDFs."
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "ai-parse-doc maintainers" }]
license = { text = "Apache-2.0" }

dependencies = [
    "mlflow>=2.20.0",
    "pypdfium2>=4.30.0",
    "pillow>=10.4.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
serving = [
    # See src/doc_parser/log_models.py for the rationale on these pins.
    "torch==2.5.1",
    "transformers~=4.57.0",
    "accelerate>=1.0.0,<2.0.0",
    "huggingface_hub>=0.26.0,<1.0.0",
    "einops>=0.8.0",
    "sentencepiece>=0.2.0",
    "tiktoken>=0.8.0",
    "timm>=1.0.0",
]
dev = [
    "ruff>=0.7.0",
    "pytest>=8.3.0",
    "pytest-mock>=3.14.0",
    "databricks-sdk>=0.40.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doc_parser"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "RUF",
]
ignore = [
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"src/tests/*" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["src"]
addopts = "-ra -q"
