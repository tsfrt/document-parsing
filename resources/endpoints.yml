# Three GPU-backed Model Serving endpoints, one per OCR model. All deploy with
# `workload_type: GPU_SMALL` (16 GB VRAM, T4-class) and scale to zero when
# idle. `entity_version` defaults to "1" and is overridden by CI from the
# "Production" alias on each registered model.
resources:
  model_serving_endpoints:
    doc-parser-florence:
      name: doc-parser-florence
      config:
        served_entities:
          - name: florence
            entity_name: ${var.catalog}.${var.schema}.florence
            entity_version: "${var.florence_version}"
            workload_size: ${var.workload_size}
            workload_type: ${var.workload_type}
            scale_to_zero_enabled: ${var.scale_to_zero_enabled}
        traffic_config:
          routes:
            - served_model_name: florence
              traffic_percentage: 100
      tags:
        - key: project
          value: ai-parse-doc
        - key: model
          value: florence

    doc-parser-phi3-vision:
      name: doc-parser-phi3-vision
      config:
        served_entities:
          - name: phi3-vision
            entity_name: ${var.catalog}.${var.schema}.phi3_vision
            entity_version: "${var.phi3_vision_version}"
            workload_size: ${var.workload_size}
            workload_type: ${var.workload_type}
            scale_to_zero_enabled: ${var.scale_to_zero_enabled}
        traffic_config:
          routes:
            - served_model_name: phi3-vision
              traffic_percentage: 100
      tags:
        - key: project
          value: ai-parse-doc
        - key: model
          value: phi3-vision

    doc-parser-granite-vision:
      name: doc-parser-granite-vision
      config:
        served_entities:
          - name: granite-vision
            entity_name: ${var.catalog}.${var.schema}.granite_vision
            entity_version: "${var.granite_vision_version}"
            workload_size: ${var.workload_size}
            workload_type: ${var.workload_type}
            scale_to_zero_enabled: ${var.scale_to_zero_enabled}
        traffic_config:
          routes:
            - served_model_name: granite-vision
              traffic_percentage: 100
      tags:
        - key: project
          value: ai-parse-doc
        - key: model
          value: granite-vision
