name: Release to prod

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    environment: production
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      BUNDLE_VAR_catalog: ${{ vars.PROD_CATALOG }}
      BUNDLE_VAR_schema: ${{ vars.PROD_SCHEMA }}
      BUNDLE_VAR_warehouse_id: ${{ vars.PROD_WAREHOUSE_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag is on main
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag commit is not on main. Refusing to release." >&2
            exit 1
          fi

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: First pass deploy (creates registered models, schema, volumes, jobs)
        run: databricks bundle deploy --target prod

      - name: Run log-ocr-models job (creates / refreshes Production aliases)
        run: databricks bundle run log-ocr-models --target prod

      - name: Resolve model versions from "Production" alias
        run: |
          set -euo pipefail
          for model in florence phi3_vision granite_vision; do
            full="${BUNDLE_VAR_catalog}.${BUNDLE_VAR_schema}.${model}"
            ver=$(databricks model-versions get-by-alias "$full" Production --output json | jq -r '.version')
            echo "BUNDLE_VAR_${model}_version=${ver}" >> "$GITHUB_ENV"
            echo "Resolved ${model} -> v${ver}"
          done

      - name: Second pass deploy (updates serving endpoints to resolved versions)
        run: databricks bundle deploy --target prod

      - name: Apply SQL UDFs
        run: databricks bundle run deploy-ocr-udfs --target prod

      - name: Smoke test endpoints
        run: databricks bundle run smoke-test-ocr-endpoints --target prod
